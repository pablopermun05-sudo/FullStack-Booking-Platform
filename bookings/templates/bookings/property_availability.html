{% extends "bookings/layout.html" %}
{% load static %}

{% block body %}
<div class="container pt-5 pb-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">{{ property.title }} — Disponibilidad</h2>
        </div>

        <div class="card-body">
            <div class="row g-4">

                <div class="col-lg-9">
                    <div
                        id="property-availability-calendar"
                        data-reset-url="{% url 'property_availability_reset' property.id %}"
                        data-data-url="{% url 'property_availability_data' property.id %}"
                        data-default-price="{{ property.default_price_per_night }}"
                        data-default-min-nights="{{ property.default_min_nights }}"
                    >
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="availability-previous-year"
                            >
                                <i class="bi bi-chevron-double-left"></i>
                            </button>

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="availability-previous-month"
                            >
                                <i class="bi bi-chevron-left"></i>
                            </button>

                            <h3
                                class="mb-0 fw-bold"
                                id="availability-current-month"
                            ></h3>

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="availability-next-month"
                            >
                                <i class="bi bi-chevron-right"></i>
                            </button>

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="availability-next-year"
                            >
                                <i class="bi bi-chevron-double-right"></i>
                            </button>
                        </div>

                        <div
                            id="availability-calendar-grid"
                            class="availability-calendar-grid"
                        ></div>

                    </div>
                </div>

                <div class="col-lg-3">
                    <div class="card h-100">
                        <div class="card-header">
                            <h4 class="mb-0">
                                Editar disponibilidad
                            </h4>
                        </div>

                        <div class="card-body">

                            <div class="mb-3">
                                <label
                                    for="availability-start-date"
                                    class="form-label"
                                >
                                    Fecha de inicio
                                </label>

                                <input
                                    type="date"
                                    id="availability-start-date"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label
                                    for="availability-end-date"
                                    class="form-label"
                                >
                                    Fecha de fin
                                </label>

                                <input
                                    type="date"
                                    id="availability-end-date"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label
                                    for="availability-status"
                                    class="form-label"
                                >
                                    Estado
                                </label>

                                <select
                                    id="availability-status"
                                    class="form-select"
                                >
                                    <option value="" selected></option>
                                    <option value="OPEN">Abierto</option>
                                    <option value="CLOSED">Cerrado</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label
                                    for="availability-min-nights"
                                    class="form-label"
                                >
                                    Número mínimo de noches
                                </label>

                                <input
                                    type="number"
                                    id="availability-min-nights"
                                    class="form-control"
                                    min="1"
                                >
                            </div>

                            <div class="mb-3">
                                <label
                                    for="availability-price"
                                    class="form-label"
                                >
                                    Precio por noche
                                </label>

                                <input
                                    type="number"
                                    id="availability-price"
                                    class="form-control"
                                    min="0.01"
                                    step="0.01"
                                >
                            </div>

                            {% csrf_token %}
                            <button
                                type="button"
                                class="btn btn-outline-danger w-100 mb-2"
                                id="availability-reset"
                            >
                                Restaurar valores por defecto
                            </button>

                            <button
                                type="button"
                                class="btn btn-primary w-100"
                                id="availability-save"
                            >
                                Guardar cambios
                            </button>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script src="{% static 'bookings/property_availability.js' %}"></script>
{% endblock %}
